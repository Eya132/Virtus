controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
create_checkout_session:
    path: /create-checkout-session/{id}
    controller: App\Controller\PaymentController::createCheckoutSession
    methods: POST

payment_success:
    path: /payment/success
    controller: App\Controller\PaymentController::success

payment_cancel:
    path: /payment/cancel
    controller: App\Controller\PaymentController::cancel
