hwi_oauth:
    firewall_names: [main]
    resource_owners:
        google:
            type:                google
            client_id:           '%env(OAUTH_GOOGLE_CLIENT_ID)%'
            client_secret:       '%env(OAUTH_GOOGLE_CLIENT_SECRET)%'
            scope:               "email profile"
            options:
                access_type:     offline
                approval_prompt: force
        facebook:
            type:                facebook
            client_id:           '%env(OAUTH_FACEBOOK_CLIENT_ID)%'
            client_secret:       '%env(OAUTH_FACEBOOK_CLIENT_SECRET)%'
            scope:               "email"
            options:
                display:         popup
